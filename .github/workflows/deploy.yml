# Builds the old GitHub Pages copy at mateo-nasse.github.io/portfolio, so existing links keep
# working. The main site is mateonasse.com, deployed by Vercel from this repo.
name: Deploy portfolio to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Vite 7 needs Node 20.19 or newer.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./portfolio

      - name: Build
        run: npm run build
        working-directory: ./portfolio
        env:
          BASE_PATH: /portfolio/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./portfolio/dist
